name: Validate operator files

on:
  pull_request:
    paths:
      - "operators/**/*.yaml"
      - "schema/operator.schema.json"
      - "scripts/validate.mjs"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate all operator YAML files
        run: node scripts/validate.mjs

      - name: Comment on PR (on failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "❌ **Validation failed.** Please check the workflow logs and fix the errors before this PR can be merged.\n\nHäufige Fehler:\n- Zeitfenster decken nicht lückenlos 00:00–24:00 ab\n- NT/ST-Verhältnis außerhalb 10–40%\n- HT > 2× ST\n- `id` stimmt nicht mit Dateiname überein\n- Datei liegt nicht unter `operators/<country>/` (z.B. `operators/de/`)"
            })
