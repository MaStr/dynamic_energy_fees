name: FTP Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate operator files
        run: node scripts/validate.mjs

      - name: Build JSON index
        run: node scripts/build-index.mjs

      - name: Copy web assets into dist/
        run: |
          cp -r web/* dist/
          cp -r schema dist/schema

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP
        env:
          FTP_HOST:       ${{ secrets.FTP_HOST }}
          FTP_USERNAME:   ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD:   ${{ secrets.FTP_PASSWORD }}
          FTP_PORT:       ${{ vars.FTP_PORT }}
          FTP_PROTOCOL:   ${{ vars.FTP_PROTOCOL }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_PROTOCOL://$FTP_HOST:$FTP_PORT" <<EOF
            set ssl:verify-certificate no
            mirror --reverse --delete --verbose dist/ $FTP_SERVER_DIR/dist/
            mirror --reverse --delete --verbose api/  $FTP_SERVER_DIR/api/
            bye
          EOF
