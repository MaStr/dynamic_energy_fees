<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>§14a EnWG Modul 3 – Netzentgelte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #0d0f12;
      --surface:   #161a1f;
      --border:    #252b33;
      --muted:     #3d4751;
      --text:      #cdd5de;
      --text-dim:  #6b7785;
      --nt:        #22c55e;
      --nt-bg:     rgba(34,197,94,.12);
      --st:        #f59e0b;
      --st-bg:     rgba(245,158,11,.12);
      --ht:        #ef4444;
      --ht-bg:     rgba(239,68,68,.12);
      --accent:    #3b82f6;
      --mono:      "IBM Plex Mono", monospace;
      --sans:      "IBM Plex Sans", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 20px 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
    }
    header h1 {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .08em;
      color: var(--accent);
      text-transform: uppercase;
      flex-shrink: 0;
    }
    header h1 span { color: var(--text-dim); }
    .header-meta {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
      margin-left: auto;
      white-space: nowrap;
    }
    #search-wrap {
      flex: 1;
      max-width: 360px;
      position: relative;
    }
    #search-wrap svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      pointer-events: none;
    }
    #search {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      padding: 7px 12px 7px 34px;
      outline: none;
      transition: border-color .15s;
    }
    #search:focus { border-color: var(--accent); }
    #search::placeholder { color: var(--muted); }

    /* ── Layout ─────────────────────────────────── */
    .app { display: flex; height: calc(100vh - 57px); overflow: hidden; }

    /* ── Sidebar ────────────────────────────────── */
    aside {
      width: 280px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .op-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background .1s;
    }
    .op-item:hover { background: var(--surface); }
    .op-item.active { background: rgba(59,130,246,.1); border-left: 2px solid var(--accent); }
    .op-item .op-id {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .country-tag {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .06em;
      padding: 1px 5px;
      border: 1px solid var(--border);
      color: var(--text-dim);
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .op-item .op-name {
      font-size: 12px;
      color: var(--text);
      line-height: 1.3;
    }
    .op-item .op-years {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 3px;
    }
    .op-empty {
      padding: 24px 16px;
      color: var(--text-dim);
      font-size: 12px;
      text-align: center;
    }

    /* ── Main panel ─────────────────────────────── */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .placeholder {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-dim);
    }
    .placeholder svg { opacity: .2; }
    .placeholder p { font-family: var(--mono); font-size: 12px; }

    /* ── Operator detail ────────────────────────── */
    .detail-header {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .detail-id {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .detail-name {
      font-size: 20px;
      font-weight: 300;
      color: var(--text);
      margin-bottom: 10px;
    }
    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag {
      font-family: var(--mono);
      font-size: 10px;
      padding: 3px 8px;
      border: 1px solid var(--border);
      color: var(--text-dim);
    }
    .tag a { color: inherit; text-decoration: none; }
    .tag a:hover { color: var(--accent); }

    /* ── Year selector ──────────────────────────── */
    .year-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
    }
    .year-tab {
      font-family: var(--mono);
      font-size: 12px;
      padding: 6px 16px;
      border: 1px solid var(--border);
      cursor: pointer;
      background: transparent;
      color: var(--text-dim);
      transition: all .15s;
    }
    .year-tab:hover { border-color: var(--muted); color: var(--text); }
    .year-tab.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(59,130,246,.08);
    }

    /* ── Quarter grid ───────────────────────────── */
    .quarters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    .quarter-card {
      border: 1px solid var(--border);
      background: var(--surface);
      overflow: hidden;
    }
    .quarter-label {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .1em;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text-dim);
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .quarter-months { font-weight: 400; font-size: 10px; }

    /* Timeline bar */
    .timeline {
      display: flex;
      height: 28px;
      margin: 12px 14px 6px;
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
    }
    .tl-segment {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .04em;
      overflow: hidden;
      position: relative;
    }
    .tl-segment.NT { background: var(--nt-bg); color: var(--nt); }
    .tl-segment.ST { background: var(--st-bg); color: var(--st); }
    .tl-segment.HT { background: var(--ht-bg); color: var(--ht); }

    /* Slots table */
    .slots-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--mono);
      font-size: 11px;
    }
    .slots-table td {
      padding: 6px 14px;
      border-top: 1px solid var(--border);
    }
    .slots-table td:first-child { color: var(--text-dim); white-space: nowrap; }
    .slots-table td:last-child { text-align: right; }
    .badge {
      display: inline-block;
      padding: 2px 7px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .06em;
    }
    .badge.NT { background: var(--nt-bg); color: var(--nt); }
    .badge.ST { background: var(--st-bg); color: var(--st); }
    .badge.HT { background: var(--ht-bg); color: var(--ht); }


    /* ── API section ────────────────────────────── */
    .api-section {
      margin-top: 32px;
      border: 1px solid var(--border);
      background: var(--surface);
    }
    .api-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }
    .api-section-title {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .api-docs-link {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
      text-decoration: none;
      transition: color .15s;
    }
    .api-docs-link:hover { color: var(--accent); }
    .api-call { border-bottom: 1px solid var(--border); }
    .api-call:last-child { border-bottom: none; }
    .api-call-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
    }
    .api-method {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      color: var(--nt);
      flex-shrink: 0;
    }
    .api-url {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .api-call-label {
      font-size: 11px;
      color: var(--text-dim);
      flex-shrink: 0;
    }
    .api-btn {
      font-family: var(--mono);
      font-size: 10px;
      padding: 3px 10px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      transition: all .15s;
      flex-shrink: 0;
    }
    .api-btn:hover:not(:disabled) { border-color: var(--muted); color: var(--text); }
    .api-btn:disabled { opacity: .4; cursor: not-allowed; }
    .api-btn.copied { color: var(--nt); border-color: var(--nt); }
    .api-btn.running { color: var(--accent); border-color: var(--accent); }
    .api-result {
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 14px 16px;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.7;
      color: var(--text);
      overflow: auto;
      max-height: 280px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .api-result.error { color: var(--ht); }

    /* Loading/error states */
    .loading {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-dim);
      padding: 40px;
      text-align: center;
    }

    @media (max-width: 680px) {
      aside { display: none; }
      main { padding: 16px; }
    }
  </style>
</head>
<body>

<header>
  <h1>§14a <span>EnWG</span> Modul&nbsp;3</h1>
  <div id="search-wrap">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="search" type="search" placeholder="Netzbetreiber suchen …" autocomplete="off">
  </div>
  <div class="header-meta" id="header-meta">Lade…</div>
  <a href="https://github.com/MaStr/dynamic_energy_fees" target="_blank" rel="noopener" title="GitHub Repository" style="color:var(--text-dim);display:flex;align-items:center;flex-shrink:0;transition:color .15s" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-dim)'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
    </svg>
  </a>
</header>

<div class="app">
  <aside id="sidebar"><div class="loading">Lade Netzbetreiber…</div></aside>
  <main id="main">
    <div class="placeholder">
      <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <rect x="2" y="7" width="20" height="14" rx="1"/>
        <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
        <line x1="12" y1="12" x2="12" y2="16"/>
        <line x1="10" y1="14" x2="14" y2="14"/>
      </svg>
      <p>Netzbetreiber aus der Liste wählen</p>
    </div>
  </main>
</div>

<script>
// ── Constants ────────────────────────────────────────────────────────────────
const QUARTER_MONTHS = { Q1:'Jan–Mär', Q2:'Apr–Jun', Q3:'Jul–Sep', Q4:'Okt–Dez' };
const BASE = './';   // works both locally and on GitHub Pages

// ── State ────────────────────────────────────────────────────────────────────
let allOperators = [];
let currentOperator = null;
let selectedYear = null;

// ── Bootstrap ────────────────────────────────────────────────────────────────
async function boot() {
  try {
    const res = await fetch(`${BASE}index.json`);
    const { operators, generated_at, count } = await res.json();
    allOperators = operators;
    document.getElementById('header-meta').textContent =
      `${count} Netzbetreiber · ${new Date(generated_at).toLocaleDateString('de-DE')}`;
    renderSidebar(operators);
  } catch (e) {
    document.getElementById('sidebar').innerHTML =
      `<div class="op-empty">Fehler beim Laden der Daten</div>`;
  }
}

// ── Sidebar ──────────────────────────────────────────────────────────────────
function renderSidebar(ops) {
  const el = document.getElementById('sidebar');
  if (!ops.length) { el.innerHTML = '<div class="op-empty">Keine Treffer</div>'; return; }
  el.innerHTML = ops.map(op => `
    <div class="op-item ${currentOperator?.id === op.id && currentOperator?.country === op.country ? 'active' : ''}"
         data-id="${op.id}" data-country="${op.country}" role="button" tabindex="0">
      <div class="op-id"><span class="country-tag">${escHtml(op.country)}</span>${escHtml(op.id)}</div>
      <div class="op-name">${escHtml(op.name)}</div>
      <div class="op-years">${op.years.join(' · ')}</div>
    </div>`).join('');
  el.querySelectorAll('.op-item').forEach(el => {
    el.addEventListener('click', () => loadOperator(el.dataset.country, el.dataset.id));
    el.addEventListener('keydown', e => { if (e.key === 'Enter') loadOperator(el.dataset.country, el.dataset.id); });
  });
}

// ── Search ───────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  renderSidebar(
    allOperators.filter(op =>
      op.id.includes(q) || op.name.toLowerCase().includes(q) ||
      op.country.includes(q) ||
      (op.regions ?? []).some(r => r.toLowerCase().includes(q))
    )
  );
});

// ── Load operator ────────────────────────────────────────────────────────────
async function loadOperator(country, id) {
  document.getElementById('main').innerHTML = '<div class="loading">Lade …</div>';
  try {
    const res = await fetch(`${BASE}operators/${country}/${id}.json`);
    const data = await res.json();
    currentOperator = { ...data, country };
    const years = Object.keys(data.tariffs ?? {}).sort().reverse();
    selectedYear = years[0] ?? null;
    renderDetail(currentOperator, years);
    const q = document.getElementById('search').value.toLowerCase();
    renderSidebar(allOperators.filter(op =>
      op.id.includes(q) || op.name.toLowerCase().includes(q) ||
      op.country.includes(q) ||
      (op.regions ?? []).some(r => r.toLowerCase().includes(q))
    ));
  } catch (e) {
    document.getElementById('main').innerHTML =
      `<div class="loading">Fehler beim Laden von ${escHtml(country)}/${escHtml(id)}</div>`;
  }
}

// ── Detail view ──────────────────────────────────────────────────────────────
function renderDetail(op, years) {
  const meta = [
    op.bdew_code ? `<span class="tag">BDEW ${escHtml(op.bdew_code)}</span>` : '',
    `<span class="tag"><a href="${escHtml(op.website)}" target="_blank" rel="noopener">Preisblatt ↗</a></span>`,
    ...(op.regions ?? []).map(r => `<span class="tag">${escHtml(r)}</span>`),
  ].filter(Boolean).join('');

  const yearTabs = years.map(y => `
    <button class="year-tab ${y === selectedYear ? 'active' : ''}"
            data-year="${y}">${y}</button>`).join('');

  document.getElementById('main').innerHTML = `
    <div class="detail-header">
      <div class="detail-id">operators/${escHtml(op.country)}/${escHtml(op.id)}.yaml</div>
      <div class="detail-name">${escHtml(op.name)}</div>
      <div class="detail-meta">${meta}</div>
    </div>
    <div class="year-tabs" id="year-tabs">${yearTabs}</div>
    <div id="quarters-container"></div>
    <div id="api-container"></div>`;

  document.getElementById('year-tabs').addEventListener('click', e => {
    const btn = e.target.closest('.year-tab');
    if (!btn) return;
    selectedYear = btn.dataset.year;
    document.querySelectorAll('.year-tab').forEach(t => t.classList.toggle('active', t === btn));
    renderYear(op, selectedYear);
  });

  if (selectedYear) renderYear(op, selectedYear);
  document.getElementById('api-container').innerHTML = renderApiSection(op);
}

function renderYear(op, year) {
  const quarters = op.tariffs?.[year] ?? {};
  const container = document.getElementById('quarters-container');

  container.innerHTML = `<div class="quarters-grid">
    ${['Q1','Q2','Q3','Q4'].map(q => {
      const slots = quarters[q];
      if (!slots) return `<div class="quarter-card">
        <div class="quarter-label">${q} <span class="quarter-months">${QUARTER_MONTHS[q]}</span></div>
        <div style="padding:16px;font-family:var(--mono);font-size:11px;color:var(--text-dim)">Keine Daten</div>
      </div>`;
      return renderQuarterCard(q, slots);
    }).join('')}
  </div>`;

}

function renderQuarterCard(q, slots) {
  const total = 24 * 60;
  const timelineSegs = slots.map(s => {
    const pct = ((toMin(s.to) - toMin(s.from)) / total * 100).toFixed(2);
    const label = toMin(s.to) - toMin(s.from) >= 90 ? s.tariff : '';
    return `<div class="tl-segment ${s.tariff}" style="width:${pct}%" title="${s.from}–${s.to} ${s.tariff}">${label}</div>`;
  }).join('');

  const rows = slots.map(s => `<tr>
    <td>${s.from}–${s.to}</td>
    <td><span class="badge ${s.tariff}">${s.tariff}</span></td>
    <td>${s.price_ct_kwh_net.toFixed(2)} ct/kWh</td>
  </tr>`).join('');

  return `<div class="quarter-card">
    <div class="quarter-label">${q} <span class="quarter-months">${QUARTER_MONTHS[q]}</span></div>
    <div class="timeline">${timelineSegs}</div>
    <table class="slots-table"><tbody>${rows}</tbody></table>
  </div>`;
}

// ── API section ──────────────────────────────────────────────────────────────
function renderApiSection(op) {
  const base = '/api/';
  const p = `country=${encodeURIComponent(op.country)}&operator=${encodeURIComponent(op.id)}`;
  const calls = [
    { label: 'Nächste 48 h',        url: `${base}?${p}` },
    { label: 'Nächste 96 h',        url: `${base}?${p}&next_hours=96` },
    { label: 'Rohdaten',            url: `${base}?${p}&mode=raw` },
  ];
  return `
    <div class="api-section">
      <div class="api-section-header">
        <span class="api-section-title">API</span>
        <a href="${base}" target="_blank" rel="noopener" class="api-docs-link">Dokumentation ↗</a>
      </div>
      ${calls.map((c, i) => `
        <div class="api-call">
          <div class="api-call-row">
            <span class="api-method">GET</span>
            <code class="api-url" title="${escHtml(c.url)}">${escHtml(c.url)}</code>
            <span class="api-call-label">${escHtml(c.label)}</span>
            <button class="api-btn" onclick="copyApiUrl('${escHtml(c.url)}', this)">copy</button>
            <button class="api-btn" onclick="runApiCall('${escHtml(c.url)}', 'api-res-${i}', this)">run ▶</button>
          </div>
          <pre class="api-result" id="api-res-${i}" style="display:none"></pre>
        </div>`).join('')}
    </div>`;
}

async function runApiCall(url, resultId, btn) {
  const el = document.getElementById(resultId);
  el.className = 'api-result';
  el.style.display = 'block';
  el.textContent = 'Lade…';
  btn.disabled = true;
  btn.classList.add('running');
  try {
    const res = await fetch(url);
    const data = await res.json();
    el.textContent = JSON.stringify(data, null, 2);
  } catch (e) {
    el.classList.add('error');
    el.textContent = `Fehler: ${e.message}`;
  }
  btn.disabled = false;
  btn.classList.remove('running');
}

function copyApiUrl(url, btn) {
  navigator.clipboard.writeText(url).then(() => {
    btn.textContent = 'copied ✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'copy'; btn.classList.remove('copied'); }, 2000);
  });
}

// ── Utils ────────────────────────────────────────────────────────────────────
function toMin(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}
function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

boot();
</script>
